[project]
name="slt-deep"
version = "0.1.0"
description = "Singular Learning Theory analysis of deep learning models: Local Learning Coefficient computation, MCMC sampling, and KL profiling for deep linear networks and beyond"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pathlib2>=2.3",
    "typer>=0.16",
    "tqdm>=4.67.1",
    "seaborn>=0.13.2",
    "graphviz>=0.21",
    "nutpie>=0.16.4",  # HMC sampling for SLT
    "numba>=0.63.1",   # Fast numerical computation
    "papermill>=2.6.0",
    "torch>=2.0.0",    # Deep learning models
    "jax>=0.4.0",      # JAX for automatic differentiation
    "jaxlib>=0.4.0",   # JAX linear algebra backend
    "blackjax>=1.0.0", # MCMC sampling (HMC, SGLD)
    "arviz>=0.17.0",   # Bayesian analysis and diagnostics
    "scipy_extensions",
    "torch-random",
    "torch-bdn",
    "torch-dln",
]
[project.optional-dependencies]
dev = [
    "nbqa",
    "black",
    "ruff",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "jupyterlab>=4.5.3",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "runcell>=0.1.17",
    "pymc>=5.27.1"
]

[dependency-groups]
publishing = [
    "quarto-cli",
    "nbconvert>=7.17.0",
    "jupyterlab-quarto>=0.3.4"
]

[tool.uv.workspace]
members = [
    "packages/*",
    "projects/*/packages/*"
]

[tool.uv.sources]
scipy_extensions = { workspace = true }
kl = { workspace = true }
torch-random = { workspace = true, editable = true }
torch-bdn = { workspace = true, editable = true }
torch-dln = { workspace = true, editable = true }

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports ok in __init__
"notebooks/**" = ["E402", "F401", "F403"]  # notebooks have different import patterns

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["packages", "projects"]
python_files = ["test_*.py", "*_test.py"]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "NPY",
    "PD",
    "RUF",
]
ignore = [
    "E501",
    "B008",
    "B905",
]
