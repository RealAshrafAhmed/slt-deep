[project]
name = "pytorch-models"
version = "0.1.0"
description = "Reusable PyTorch model definitions for markov-chain-learning experiments"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pytorch_models"]
