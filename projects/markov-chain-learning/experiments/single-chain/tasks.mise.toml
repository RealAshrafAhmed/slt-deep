["mcl-sc:no-hessian:data"]
description = "Single-chain H1: NUTS sampling without Hessian init (data generation)"
dir = "projects/markov-chain-learning/experiments/single-chain"
usage = '''
flag "--run-name <name>" help="Run name (used for output directory)" env="RUN_NAME" default="default"
flag "--n-warmup <n>" help="Initial H1 warmup steps" env="N_WARMUP" default="2000"
flag "--n-production <n>" help="H1 production samples" env="N_PRODUCTION" default="500"
flag "--run-iterative <bool>" help="Run H1-1 iterative refinement" env="RUN_ITERATIVE" default="true"
flag "--n-rounds <n>" help="H1-1: number of warmup→production rounds" env="N_ROUNDS" default="5"
flag "--n-warmup-per-round <n>" help="H1-1: warmup steps per round" env="N_WARMUP_PER_ROUND" default="2000"
flag "--n-samples-per-round <n>" help="H1-1: production draws per round" env="N_SAMPLES_PER_ROUND" default="500"
flag "--max-tree-depth <n>" help="NUTS max tree depth" env="MAX_TREE_DEPTH" default="4"
flag "--target-accept <f>" help="Target acceptance rate" env="TARGET_ACCEPT" default="0.6"
flag "--sigma-prior <f>" help="Prior std" env="SIGMA_PRIOR" default="10.0"
flag "--start-fresh <bool>" help="Start from identity mass matrix" env="START_FRESH" default="true"
flag "--resume <bool>" help="Resume H1-1 from highest existing round_NN.pt" env="RESUME" default="false"
flag "--log-output <enabled>" help="Stream notebook stdout to terminal" env="PAPERMILL_LOG_OUTPUT" default="true"
'''
run = '''
set -euo pipefail

RUN_NAME="${usage_run_name?}"
N_WARMUP="${usage_n_warmup?}"
N_PRODUCTION="${usage_n_production?}"
RUN_ITERATIVE="${usage_run_iterative?}"
N_ROUNDS="${usage_n_rounds?}"
N_WARMUP_PER_ROUND="${usage_n_warmup_per_round?}"
N_SAMPLES_PER_ROUND="${usage_n_samples_per_round?}"
MAX_TREE_DEPTH="${usage_max_tree_depth?}"
TARGET_ACCEPT="${usage_target_accept?}"
SIGMA_PRIOR="${usage_sigma_prior?}"
START_FRESH="${usage_start_fresh?}"
RESUME="${usage_resume?}"
PAPERMILL_LOG_OUTPUT="${usage_log_output?}"

DATA_DIR="$(pwd)/data"
EXEC_DIR="$DATA_DIR/results_no_hessian/${RUN_NAME}"
mkdir -p "$EXEC_DIR"

if [[ ! -f "$DATA_DIR/hessian.pt" ]]; then
	echo "ERROR: $DATA_DIR/hessian.pt not found. Run 04_training.ipynb first." >&2
	exit 1
fi

PAPERMILL_LOG_OUTPUT_NORMALIZED="$(printf '%s' "$PAPERMILL_LOG_OUTPUT" | tr '[:upper:]' '[:lower:]')"
LOG_FLAG=""
if [[ "$PAPERMILL_LOG_OUTPUT_NORMALIZED" == "1" || "$PAPERMILL_LOG_OUTPUT_NORMALIZED" == "true" || "$PAPERMILL_LOG_OUTPUT_NORMALIZED" == "yes" ]]; then
	LOG_FLAG="--log-output"
fi

uv run papermill $LOG_FLAG \
	notebooks/05a_sampling_no_hessian_data.ipynb \
	"$EXEC_DIR/05a_sampling_no_hessian_data_executed.ipynb" \
	-p RUN_NAME "$RUN_NAME" \
	-p N_WARMUP "$N_WARMUP" \
	-p N_PRODUCTION "$N_PRODUCTION" \
	-p RUN_ITERATIVE "$RUN_ITERATIVE" \
	-p N_ROUNDS "$N_ROUNDS" \
	-p N_WARMUP_PER_ROUND "$N_WARMUP_PER_ROUND" \
	-p N_SAMPLES_PER_ROUND "$N_SAMPLES_PER_ROUND" \
	-p MAX_TREE_DEPTH "$MAX_TREE_DEPTH" \
	-p TARGET_ACCEPT "$TARGET_ACCEPT" \
	-p SIGMA_PRIOR "$SIGMA_PRIOR" \
	-p START_FRESH "$START_FRESH" \
	-p RESUME "$RESUME"
'''

