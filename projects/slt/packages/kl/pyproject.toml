[project]
name = "kl"
version = "0.1.0"
description = "Kullback-Leibler divergence utilities for Singular Learning Theory experiments"
readme = "README.md"
authors = [
    { name = "Ashraf Ahmed", email = "ashrafahmed@sophi.io" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0"
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
