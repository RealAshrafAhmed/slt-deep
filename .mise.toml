[tasks."mcl:matrix"]
description = "Markov chain learning: full experiment matrix"
dir = "projects/markov-transformer/experiments/markov-chain-learning"
usage = '''
flag "--regimes <regimes>" help="CSV regimes for matrix run" env="REGIMES" default="single,two_far,two_close"
flag "--variants <variants>" help="CSV variants for matrix run" env="VARIANTS" default="full,no_token,no_pos,no_embeddings"
flag "--dataset-seed <seed>" help="Dataset seed" env="DATASET_SEED" default="0"
flag "--n-sequences <n>" help="Number of generated sequences" env="N_SEQUENCES" default="10000"
flag "--max-seq-len <n>" help="Maximum sequence length" env="MAX_SEQ_LEN" default="32"
flag "--training-seed <seed>" help="Training seed" env="TRAINING_SEED" default="42"
flag "--epochs <n>" help="Training epochs" env="EPOCHS" default="50"
flag "--lr <lr>" help="Learning rate" env="LR" default="0.003"
flag "--batch-size <n>" help="Batch size" env="BATCH_SIZE" default="256"
'''
run = '''
set -euo pipefail

REGIMES="${usage_regimes?}"
VARIANTS="${usage_variants?}"
DATASET_SEED="${usage_dataset_seed?}"
N_SEQUENCES="${usage_n_sequences?}"
MAX_SEQ_LEN="${usage_max_seq_len?}"
TRAINING_SEED="${usage_training_seed?}"
EPOCHS="${usage_epochs?}"
LR="${usage_lr?}"
BATCH_SIZE="${usage_batch_size?}"

IFS=',' read -r -a regime_arr <<< "$REGIMES"
IFS=',' read -r -a variant_arr <<< "$VARIANTS"

for regime in "${regime_arr[@]}"; do
	regime="${regime//[[:space:]]/}"
	for variant in "${variant_arr[@]}"; do
		variant="${variant//[[:space:]]/}"
		echo ""
		echo "=== Pipeline: $regime / $variant ==="
		mise run mcl:pipeline -- \
			--regime "$regime" \
			--variant "$variant" \
			--dataset-seed "$DATASET_SEED" \
			--n-sequences "$N_SEQUENCES" \
			--max-seq-len "$MAX_SEQ_LEN" \
			--training-seed "$TRAINING_SEED" \
			--epochs "$EPOCHS" \
			--lr "$LR" \
			--batch-size "$BATCH_SIZE"
	done
done
'''
