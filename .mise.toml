[task_config]
includes = [
  "projects/markov-chain-learning/experiments/two-mixed-chains/tasks.mise.toml",
  "projects/markov-chain-learning/experiments/single-chain/tasks.mise.toml",
]

[tasks."mcl-2mc:all"]
description = "Wrapper: run full Markov chain learning matrix"
run = [{ task = "mcl-2mc:matrix" }]

[tasks."mcl-sc:all"]
description = "Wrapper: run single-chain pipeline with default arguments"
run = [{ task = "mcl-sc:pipeline" }]
