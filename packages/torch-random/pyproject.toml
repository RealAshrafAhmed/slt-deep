[project]
name = "torch-random"
version = "0.1.0"
description = "Data sampling from conditional Gibbs measures for PyTorch models"
readme = "README.md"
authors = [
    { name = "Ashraf Ahmed", email = "ashrafahmed@sophi.io" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
